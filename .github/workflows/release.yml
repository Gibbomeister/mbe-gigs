name: Release

# Tag a version, get an installable zip attached to the release.
#
# The zip is what the eight sites download, so its top-level folder must be
# "mbe-gigs" — same as the plugin directory. A zip that unpacks to anything else
# installs as a second plugin instead of updating the one that's there.
#
#   git tag v1.0.1 && git push origin v1.0.1

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin header
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 '^ \* Version:' mbe-gigs.php | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          echo "tag=$TAG header=$HEADER"
          if [ "$TAG" != "$HEADER" ]; then
            echo "::error::Tag $TAG does not match the Version header ($HEADER). Bump the header first."
            exit 1
          fi

      - name: Lint
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build the zip
        run: |
          mkdir -p build/mbe-gigs
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' \
                   --exclude '.gitignore' --exclude '.DS_Store' \
                   ./ build/mbe-gigs/
          cd build && zip -rq mbe-gigs.zip mbe-gigs
          unzip -l mbe-gigs.zip | head -20

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/mbe-gigs.zip
          generate_release_notes: true
